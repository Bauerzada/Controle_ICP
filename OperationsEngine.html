<script>
(function(g){const S={data:{fila:[],atividades:[],curvas:[],cq:[],sequencias:[],equipamento:[],erros:[]}};
const e=id=>document.getElementById(id), esc=v=>g.escapeHtml?g.escapeHtml(v):String(v??'');
async function load(){try{S.data=await g.gas('getOperacaoBootstrap');render();syncSelectors();}catch(x){g.toast(x.message,true)}}
function open(id){e(id).style.display='block'} function close(id){e(id).style.display='none'}
function rows(id,list,fn,cols){if(!e(id))return;e(id).innerHTML=list.length?list.map(fn).join(''):'<tr><td colspan="'+cols+'"><div class="empty">Nenhum registro.</div></td></tr>'}
function render(){rows('prepBody',S.data.fila||[],x=>'<tr><td><strong>'+esc(x.Amostra)+'</strong></td><td>'+esc(x.Embalagem)+'</td><td>'+esc(x['Métodos'])+'</td><td>'+g.badge(x.Status||'Aguardando')+'</td><td>'+esc(x['Responsável'])+'</td><td>'+esc(x['Atualizado em'])+'</td><td><button class="btn" onclick="OpsICP.advancePrep(\''+esc(x.ID)+'\')">Avançar</button></td></tr>',7);
rows('activityBody',S.data.atividades||[],x=>'<tr><td>'+esc(x['Nº Atividade']||x.ID)+'</td><td>'+esc(x.CR)+' / '+esc(x.Amostra)+'</td><td>'+esc(x.Cliente)+'</td><td>'+esc(x['Parâmetro'])+'</td><td>'+esc(x['Responsável'])+'</td><td>'+g.badge(x.Status||'Aberta')+'</td><td>'+esc(x.Repetindo)+'</td><td><button class="btn" onclick="OpsICP.resolveActivity(\''+esc(x.ID)+'\')">Resolver</button></td></tr>',8);
rows('curveBody',S.data.curvas||[],x=>'<tr><td><strong>'+esc(x['Identificação'])+'</strong></td><td>'+esc(x.Tipo)+'</td><td>'+g.badge(x.Status||'Registrada')+'</td><td>'+esc(x['Volume consumido'])+' '+esc(x.Unidade)+'</td><td>'+esc(x['Responsável'])+'</td><td>'+esc(x.Data)+'</td></tr>',6);
rows('cqBody',S.data.cq||[],x=>'<tr><td>'+esc(x.Tipo)+'</td><td>'+esc(x['Método'])+'</td><td><strong>'+esc(x.Resultado)+' '+esc(x.Unidade)+'</strong></td><td>'+esc(x['Limite inferior'])+' — '+esc(x['Limite superior'])+'</td><td>'+g.badge(x.Status||'Registrado')+'</td><td>'+esc(x['Curva ID'])+'</td><td>'+esc(x['Responsável'])+'</td></tr>',7);
rows('seqBody',S.data.sequencias||[],x=>'<tr><td><strong>'+esc(x.Nome)+'</strong></td><td>'+esc(x['Método'])+'</td><td>'+esc(x.Quantidade)+'</td><td>'+esc(x['Responsável'])+'</td><td>'+g.badge(x.Status||'Planejada')+'</td><td>'+esc(x['Início'])+'</td></tr>',6);
if(e('equipmentList'))e('equipmentList').innerHTML=(S.data.equipamento||[]).map(x=>'<div class="low-item"><div><strong>'+esc(x.Tipo)+'</strong><small style="display:block;color:var(--muted)">'+esc(x['Descrição'])+'</small></div>'+g.badge(x.Status||'Aberto')+'</div>').join('')||'<div class="empty">Nenhuma ocorrência.</div>';
if(e('errorList')){const q=(e('errorSearch').value||'').toLowerCase();const l=(S.data.erros||[]).filter(x=>!q||[x['Código'],x['Título'],x.Sintoma,x.Causa,x['Solução']].join(' ').toLowerCase().includes(q));e('errorList').innerHTML=l.map(x=>'<div class="low-item"><div><strong>'+esc(x['Código']?x['Código']+' · ':'')+esc(x['Título'])+'</strong><small style="display:block;color:var(--muted)">'+esc(x['Solução'])+'</small></div></div>').join('')||'<div class="empty">Nenhuma solução encontrada.</div>'}}
function syncSelectors(){if(e('cvStock'))e('cvStock').innerHTML='<option value="">Sem desconto automático</option>'+(g.State.stock||[]).map(x=>'<option value="'+esc(x.id)+'">'+esc(x.item)+' · '+esc(x.lote)+'</option>').join('');if(e('cqCurve'))e('cqCurve').innerHTML='<option value="">Sem vínculo</option>'+(S.data.curvas||[]).map(x=>'<option value="'+esc(x.ID)+'">'+esc(x['Identificação'])+'</option>').join('')}
async function save(action,p,modal,btn){await g.busy(e(btn),'Salvando…',async()=>{await g.gas(action,p);close(modal);await load();g.toast('Registro salvo.')})}
async function saveActivity(ev){ev.preventDefault();return save('salvarAtividadeICP',{numero:e('atNumero').value,cr:e('atCr').value,amostra:e('atAmostra').value,cliente:e('atCliente').value,parametro:e('atParametro').value,motivo:e('atMotivo').value,responsavel:e('atResp').value},'activityModal','atSave')}
async function saveCurve(ev){ev.preventDefault();return save('registrarCurvaICP',{tipo:e('cvTipo').value,identificacao:e('cvId').value,estoqueId:e('cvStock').value,volume:e('cvVol').value,unidade:e('cvUnit').value,responsavel:e('cvResp').value,observacoes:e('cvObs').value},'curveModal','cvSave')}
async function saveCQ(ev){ev.preventDefault();return save('registrarCQICP',{tipo:e('cqTipo').value,metodo:e('cqMetodo').value,resultado:e('cqRes').value,unidade:e('cqUnit').value,li:e('cqLi').value,ls:e('cqLs').value,curvaId:e('cqCurve').value,responsavel:e('cqResp').value,observacoes:e('cqObs').value},'cqModal','cqSave')}
async function saveSeq(ev){ev.preventDefault();return save('salvarSequenciaICP',{nome:e('sqName').value,metodo:e('sqMethod').value,amostras:e('sqSamples').value,responsavel:e('sqResp').value,status:e('sqStatus').value},'seqModal','sqSave')}
async function saveEquipment(ev){ev.preventDefault();return save('registrarEquipamentoICP',{tipo:e('eqType').value,descricao:e('eqDesc').value,status:e('eqStatus').value,responsavel:e('eqResp').value,proxima:e('eqNext').value},'equipmentModal','eqSave')}
async function saveError(ev){ev.preventDefault();return save('registrarErroICP',{codigo:e('erCode').value,titulo:e('erTitle').value,sintoma:e('erSymptom').value,causa:e('erCause').value,solucao:e('erSolution').value,responsavel:e('erResp').value,evidencia:e('erEvidence').value},'errorModal','erSave')}
async function advancePrep(id){const x=(S.data.fila||[]).find(v=>v.ID===id);if(!x)return;const order=['Aguardando preparo','Em preparo','Preparado','Liberado'],i=Math.max(0,order.indexOf(x.Status)),next=order[Math.min(i+1,order.length-1)];await g.gas('atualizarFilaPreparoICP',{id,status:next,responsavel:(g.State.currentUser||{}).nome||x['Responsável']});await load();g.toast('Preparo atualizado para '+next+'.')}
async function resolveActivity(id){await g.gas('salvarAtividadeICP',{id,status:'Resolvida',responsavel:(g.State.currentUser||{}).nome||'',repetindo:'Não',resultado:'Resolvida'});await load();g.toast('Atividade resolvida.')}
g.OpsICP={load,render,open,close,saveActivity,saveCurve,saveCQ,saveSeq,saveEquipment,saveError,advancePrep,resolveActivity};
})(window);
</script>
