<section id="requisicoes" class="page"><div class="hero"><div><h1>Requisições de insumo</h1><p>Acompanhamento das RIs existentes do setor ICP.</p></div><button class="btn btn-primary" onclick="LogICP.load()">↻ Atualizar</button></div><div class="table-wrap"><table><thead><tr><th>RI</th><th>Item</th><th>Categoria</th><th>Status</th><th>Responsável</th><th>Observações</th><th>Ação</th></tr></thead><tbody id="reqBody"></tbody></table></div></section>
<section id="caixas" class="page"><div class="hero"><div><h1>Caixas e localização</h1><p>Rastreabilidade física das amostras armazenadas.</p></div><button class="btn btn-primary" onclick="LogICP.openBox()">Registrar localização</button></div><div class="toolbar"><input id="boxSearch" placeholder="Buscar caixa, amostra ou embalagem" oninput="LogICP.render()"><small id="boxCount"></small></div><div class="table-wrap"><table><thead><tr><th>Caixa</th><th>Amostra</th><th>Embalagem</th><th>Status</th><th>Responsável</th><th>Data</th><th>Observações</th></tr></thead><tbody id="boxBody"></tbody></table></div></section>
<div id="boxModal" class="modal-backdrop"><form class="modal-card" onsubmit="LogICP.saveBox(event)"><h2>Registrar localização</h2><div class="row"><div class="field"><label>Caixa</label><input id="bxBox" required></div><div class="field"><label>Amostra</label><input id="bxSample" required></div></div><div class="row"><div class="field"><label>Embalagem</label><input id="bxPack"></div><div class="field"><label>Status</label><select id="bxStatus"><option>Armazenada</option><option>Em preparo</option><option>Retirada</option><option>Descartada</option></select></div></div><div class="field"><label>Responsável</label><input id="bxResp"></div><div class="field"><label>Observações</label><textarea id="bxObs"></textarea></div><div class="actions"><button type="button" class="btn" onclick="LogICP.closeBox()">Cancelar</button><button class="btn btn-primary" id="bxSave">Registrar</button></div></form></div>
